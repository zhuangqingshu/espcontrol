# =============================================================================
# FACTORY BUILD - ESP32-S3 Panel 320 (320x320 square)
# =============================================================================
# Factory image: www.js bundled inline for first-boot web UI access.
# =============================================================================

substitutions:
  cover_art_placeholder_file: "../common/assets/cover_art_placeholder.svg"
  name: "espcontrol-s3-panel-320"
  friendly_name: "ESP32-S3 Panel 320"
  firmware_version: "0.0.0"
  espcontrol_component_url: "file:///config"
  mdi_font_file: "/config/common/assets/fonts/materialdesignicons-webfont-7.4.47.ttf"
  espcontrol_component_ref: "HEAD"

esp32:
  partitions: "../common/device/partitions_8mb_card_images.csv"

packages:
  core: !include ../devices/esp32-s3-panel-320/packages.yaml
  api_encryption: !include ../common/addon/api_encryption_dynamic.yaml

esphome:
  name_add_mac_suffix: true
  project:
    name: jtenniswood.espcontrol
    version: "${firmware_version}"

dashboard_import:
  package_import_url: github://jtenniswood/espcontrol/devices/esp32-s3-panel-320/esphome.yaml@main

web_server:
  port: 80
  version: 3
  js_url: https://jtenniswood.github.io/espcontrol/webserver/www.js?device=${device_slug}&v=${firmware_version}&ui=20260714-shared
  js_include: "../docs/public/webserver/embedded/www.js"

wifi:
  ap:
    ssid: "${friendly_name}"

captive_portal:
